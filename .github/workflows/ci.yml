name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_shift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d second_shift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_shift_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/second_shift_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      FILE_SCAN_MODE: optional
      CRON_SECRET: ci-only-cron-secret
      # R2_* is a module-level, NODE_ENV=production fail-closed check in
      # src/lib/storage.ts, evaluated at import time — Next's build-time page
      # data collection loads every route's module graph, so it fires even
      # though no route handler is ever invoked and no upload/download occurs.
      # These four values only satisfy that boolean presence check and get
      # embedded, unresolved, into an S3Client config object: the AWS SDK v3
      # never opens a connection at construction, only inside .send(), which
      # no code path here reaches during a build. Synthetic, non-authenticating,
      # CI-only — never written to .env.example or any real environment.
      R2_ACCOUNT_ID: ci-test-account
      R2_ACCESS_KEY_ID: ci-test-key
      R2_SECRET_ACCESS_KEY: ci-test-secret
      R2_BUCKET: ci-test-bucket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
