name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_shift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d second_shift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_shift_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/second_shift_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      FILE_SCAN_MODE: optional
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
